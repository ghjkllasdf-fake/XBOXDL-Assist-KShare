server.modules = ( "mod_redirect" )
server.document-root = "@RUN@/empty"
server.bind = "@ROUTER@"
server.port = @PORT@
server.username = "nobody"
server.groupname = "nobody"
server.pid-file = "@RUN@/light.pid"
server.max-connections = 48
server.max-read-idle = 8
server.max-write-idle = 8
server.max-keep-alive-requests = 0
$HTTP["host"] =~ "^((assets1|assets2|d1|d2|xvcf1|xvcf2)[.]xboxlive[.]com|5[.]xb[.]delivery[.]microsoft[.]com|assets1[.]xboxlive[.]com[.]edgesuite[.]net|cl-glcb907925[.]gcdn[.]co|fg[.]microsoft[.]map[.]fastly[.]net)(:80)?$" {
    url.redirect-code = 302
    url.redirect = ( "^(/.*)$" => "http://assets1.xboxlive.cn$1" )
}
$HTTP["host"] =~ "^dlassets2?[.]xboxlive[.]com(:80)?$" {
    url.redirect-code = 302
    url.redirect = ( "^(/.*)$" => "http://dlassets.xboxlive.cn$1" )
}
